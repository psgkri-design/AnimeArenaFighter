name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CC0 character assets
        run: |
          mkdir -p assets/kaykit
          BASE="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Characters/gltf"
          curl -fL "$BASE/Rogue_Hooded.glb" -o assets/kaykit/Rogue_Hooded.glb
          curl -fL "$BASE/Mage.glb" -o assets/kaykit/Mage.glb
          curl -fL "$BASE/Knight.glb" -o assets/kaykit/Knight.glb
          curl -fL "$BASE/Rogue.glb" -o assets/kaykit/Rogue.glb
          curl -fL "https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/LICENSE.txt" -o assets/kaykit/KAYKIT_LICENSE.txt
          mkdir -p assets/kaykit/weapons
          ASSET_BASE="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Assets/gltf"
          for NAME in dagger staff sword_2handed_color sword_1handed; do
            curl -fL "$ASSET_BASE/$NAME.gltf" -o "assets/kaykit/weapons/$NAME.gltf"
            curl -fL "$ASSET_BASE/$NAME.bin" -o "assets/kaykit/weapons/$NAME.bin"
          done
          curl -fL "$ASSET_BASE/rogue_texture.png" -o assets/kaykit/weapons/rogue_texture.png
          curl -fL "$ASSET_BASE/mage_texture.png" -o assets/kaykit/weapons/mage_texture.png
          curl -fL "$ASSET_BASE/knight_texture.png" -o assets/kaykit/weapons/knight_texture.png

          # Adult-proportion Quaternius bodies + UAL1 clips. Pinned CC0 mirrors.
          mkdir -p assets/quaternius
          QBASE="https://raw.githubusercontent.com/glashoff/noob_tube/e191d4dfa0569b800563e7cd2b7db346355358ed/assets/characters"
          for FILE in Superhero_Male_FullBody.gltf Superhero_Male_FullBody.bin Superhero_Female_FullBody.gltf Superhero_Female_FullBody.bin \
                      T_Eye_Brown.png T_Eye_Normal.png T_Hair_1_BaseColor.png T_Hair_1_Normal.png T_Hair_2_BaseColor.png T_Hair_2_Normal.png \
                      T_Superhero_Male_Dark.png T_Superhero_Male_Normal.png T_Superhero_Male_Roughness.png \
                      T_Superhero_Female_Dark_BaseColor.png T_Superhero_Female_Normal.png T_Superhero_Female_Roughness.png; do
            curl -fL "$QBASE/$FILE" -o "assets/quaternius/$FILE"
          done
          curl -fL "https://raw.githubusercontent.com/glashoff/noob_tube/e191d4dfa0569b800563e7cd2b7db346355358ed/assets/animations/universal_animation_library_1.glb" \
            -o assets/quaternius/universal_animation_library_1.glb
          curl -fL "https://raw.githubusercontent.com/glashoff/noob_tube/e191d4dfa0569b800563e7cd2b7db346355358ed/assets/CREDITS.md" \
            -o assets/quaternius/SOURCE_CREDITS.md
          curl -fL "https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/QUATERNIUS-LICENSE.txt" \
            -o assets/quaternius/QUATERNIUS_LICENSE.txt

          # Full-height fantasy Ranger outfits on the same 65-joint Quaternius rig.
          RANGER_BASE="https://raw.githubusercontent.com/ryan321/gigacouch/cc8aa8fdbe5207ab1bfdacff81206eb9547494d5/sdk/examples/gauntlet/assets/characters"
          for FILE in Female_Ranger.gltf Female_Ranger.bin Male_Ranger.gltf Male_Ranger.bin \
                      T_Ranger_BaseColor.png T_Ranger_Normal.png T_Ranger_ORM.png \
                      T_Regular_Female_Dark_BaseColor.png T_Regular_Female_Normal.png T_Regular_Female_Roughness.png \
                      T_Regular_Male_Dark_BaseColor.png T_Regular_Male_Normal.png T_Regular_Male_Roughness.png; do
            curl -fL "$RANGER_BASE/$FILE" -o "assets/quaternius/$FILE"
          done
          curl -fL "$RANGER_BASE/License_Standard.txt" -o assets/quaternius/RANGER_LICENSE.txt

      - name: Generate original procedural SFX
        run: python3 tools/generate_sfx.py

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Validate game startup and GDScript
        shell: bash
        run: |
          GODOT_BIN="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found after export step."
            exit 1
          fi
          set +e
          "$GODOT_BIN" --headless --path . --quit-after 5 2>&1 | tee godot-runtime-check.log
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if grep -Eqi "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-runtime-check.log; then
            echo "Godot script validation failed."
            exit 1
          fi
          exit "$GODOT_EXIT"

      - name: Run full combat smoke test
        shell: bash
        run: |
          GODOT_BIN="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          "$GODOT_BIN" --headless --path . --script res://scripts/ci_smoke_test.gd 2>&1 | tee godot-smoke-test.log
          if grep -Eqi "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|SMOKE RESULT: FAIL" godot-smoke-test.log; then
            echo "Full combat smoke validation failed."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeArenaFighter-Android
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
